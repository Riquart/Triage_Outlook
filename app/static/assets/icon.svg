<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône du complément Outlook « Add_Outlook ».
  Motif : une enveloppe (le mail) + une étincelle (la génération par IA).
  Les déclinaisons PNG exigées par le manifest sont produites à partir de ce
  fichier par `python scripts/generate_icons.py` (voir README).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="Add_Outlook — assistant de réponse">
  <title>Add_Outlook</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Pastille de fond -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Enveloppe -->
  <g transform="translate(0 2)">
    <rect x="22" y="38" width="84" height="58" rx="10" fill="#FFFFFF"/>
    <path d="M30 47 L64 72 L98 47" fill="none" stroke="#4F46E5" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Étincelle « IA » -->
  <path d="M97 12 C99.5 24.5 103.5 28.5 116 31 C103.5 33.5 99.5 37.5 97 50
           C94.5 37.5 90.5 33.5 78 31 C90.5 28.5 94.5 24.5 97 12 Z"
        fill="#FDE68A" stroke="#4F46E5" stroke-width="4" stroke-linejoin="round"/>
</svg>
